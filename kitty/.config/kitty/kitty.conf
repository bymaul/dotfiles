font_family JetBrainsMono Nerd Font Mono
font_size 11.0

# oxocarbon dark palette
background #161616
foreground #d0d0d0
cursor #d0d0d0
cursor_text_color #161616
selection_background #393939
selection_foreground #f2f2f2

color0 #262626
color1 #33b1ff
color2 #be95ff
color3 #42be65
color4 #78a9ff
color5 #82cfff
color6 #3ddbd9
color7 #f2f2f2
color8 #525252
color9 #33b1ff
color10 #be95ff
color11 #42be65
color12 #78a9ff
color13 #82cfff
color14 #08bdba
color15 #ffffff

url_color #78a9ff
active_border_color #78a9ff
inactive_border_color #262626
bell_border_color #78a9ff

active_tab_foreground #161616
active_tab_background #d0d0d0
inactive_tab_foreground #d0d0d0
inactive_tab_background #262626

hide_window_decorations no
window_padding_width 10

cursor_shape block
cursor_blink_interval 0

scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT

copy_on_select clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

tab_bar_style powerline
tab_bar_margin_width 4

background_opacity 1.0
dynamic_background_opacity no

shell_integration enabled
