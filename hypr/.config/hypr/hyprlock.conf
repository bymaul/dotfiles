$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    contrast = 0.9
    brightness = 0.6
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 1
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(255, 255, 255, 0.6)
    check_color = rgba(255, 255, 255, 1.0)
    fail_color = rgba(255, 255, 255, 1.0)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.35

    font_family = $font
    placeholder_text = Enter password...
    fail_text = $FAIL

    position = 0, -180
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 52
    font_family = $font
    color = rgb(255, 255, 255)

    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 15
    font_family = $font
    color = rgb(170, 170, 170)

    position = 0, -80
    halign = center
    valign = center
}
