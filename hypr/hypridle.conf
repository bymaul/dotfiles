general {
    lock_cmd = qs ipc call bar lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}

listener {
    timeout = 120
    on-timeout = b=$(brightnessctl g 2>/dev/null) && [ "${b:-0}" -gt 2500 ] 2>/dev/null && brightnessctl -s set 3% >/dev/null 2>&1; hyprctl hyprsunset gamma 50
    on-resume = brightnessctl -r >/dev/null 2>&1; hyprctl hyprsunset gamma 100
}

listener {
    timeout = 120
    on-timeout = brightnessctl -sd '*:kbd_backlight' set 0 >/dev/null 2>&1 || true
    on-resume = brightnessctl -rd '*:kbd_backlight' >/dev/null 2>&1 || true
}

listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session; hyprctl eval 'hl.dispatch(hl.dsp.dpms("off"))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}

listener {
    timeout = 1800
    on-timeout = loginctl lock-session; systemctl suspend
}

