include=~/.config/foot/vague.ini

[main]
font=JetBrainsMono Nerd Font Mono:size=10
pad=10x10

[scrollback]
indicator-position=relative
indicator-format=line

[csd]
preferred=none

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.98
blur=yes
selection-foreground=cdcdcd
selection-background=252530
urls=bb9dbd
