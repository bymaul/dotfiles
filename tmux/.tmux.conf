# ---- General ----

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

set -g prefix C-s

set -g mouse on
set -g focus-events on

# True color
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",$TERM:Tc"

# ---- Pane navigation (vim) ----
unbind h
unbind j
unbind k
unbind l
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Splits
bind | split-window -h
bind - split-window -v

# ---- Appearance: oxocarbon ----
# oxocarbon dark: bg #161616, fg #d0d0d0, soft accent #78a9ff

set -g status-interval 5
set -g status-position bottom
set -g status-style bg=#161616 fg=#d0d0d0

set -g status-left "#[fg=#78a9ff] #S "
set -g status-left-length 40
set -g status-right "#[fg=#5c5c5c] %H:%M  %d %b "
set -g status-right-length 40

set -g window-status-separator ""
set -g window-status-format " #[fg=#5c5c5c]#I:#W "
set -g window-status-current-format " #[fg=#161616]#[bg=#d0d0d0] #I:#W "
set -g window-status-current-style bg=default

set -g message-style bg=#161616 fg=#d0d0d0
set -g pane-border-style fg=#262626
set -g pane-active-border-style fg=#78a9ff
